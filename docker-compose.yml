version: '3.8'

services:
  anticap-webapi:
    build: .
    container_name: anticap-webapi
    ports:
      - "6688:8000"
    environment:
      - PYTHONPATH=/app
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
      - PORT=8000
      - DEFAULT_USERNAME=${DEFAULT_USERNAME:?set DEFAULT_USERNAME in .env}
      - DEFAULT_PASSWORD=${DEFAULT_PASSWORD:?set DEFAULT_PASSWORD in .env}
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - anticap-network

networks:
  anticap-network:
    driver: bridge
